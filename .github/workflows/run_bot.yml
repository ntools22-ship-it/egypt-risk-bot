name: Egypt Risk Radar Bot

on:
  schedule:
    - cron: '*/15 * * * *'    # أخبار كل 15 دقيقة
    - cron: '0 5 * * *'       # تقرير يومي 7 صباحاً (5 UTC)
    - cron: '0 20 * * *'      # موجز يومي 10 مساءً (20 UTC)
    - cron: '0 6 * * 0'       # تقرير أسبوعي الأحد 8 صباحاً (6 UTC)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: false
        default: 'news'
        type: choice
        options:
          - news
          - digest
          - report_daily
          - report_weekly
          - pdf

concurrency:
  group: egypt-risk-radar-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 fpdf2 arabic-reshaper python-bidi

      - name: Determine run mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 5 * * *" ]; then
            echo "mode=report_daily" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 20 * * *" ]; then
            echo "mode=digest" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 6 * * 0" ]; then
            echo "mode=report_weekly" >> "$GITHUB_OUTPUT"
          else
            echo "mode=news" >> "$GITHUB_OUTPUT"
          fi

      - name: Show run mode
        run: echo "RUN_MODE = ${{ steps.mode.outputs.mode }}"

      - name: Run bot
        env:
          BOT_TOKEN:      ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL:   ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:   ${{ secrets.SUPABASE_KEY }}
          RUN_MODE:       ${{ steps.mode.outputs.mode }}
        run: python bot.py
